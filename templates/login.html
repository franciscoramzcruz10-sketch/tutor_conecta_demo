<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Tutor Conecta</title>
    <style>
        :root {
            --azul: #1d4ed8;
            --azul-oscuro: #1e3a8a;
            --azul-claro: #e0efff;
            --rojo: #dc2626;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--azul-claro);
            color: var(--azul-oscuro);
        }

        .contenedor {
            width: 320px;
            max-width: calc(100% - 60px);
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            border-top: 5px solid var(--rojo);
            box-shadow: 0 4px 15px #1d4ed826;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: var(--azul);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid var(--azul);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: var(--azul);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: var(--azul-oscuro);
        }

        .error {
            background: #fee2e2;
            color: var(--rojo);
            border: 1px solid var(--rojo);
            padding: 10px;
            border-radius: 6px;
            margin: 15px 0 0;
            text-align: center;
        }

        .enlace {
            margin-top: 20px;
        }

        .enlace a {
            color: var(--azul);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Tutor Conecta</h1>
        <h2>Iniciar sesión</h2>

        <form action="{{ url_for('inicio_sesion') }}" method="post">

            <label for="numero_control">Número de control</label>
            <input type="text" id="numero_control" name="numero_control"
                   placeholder="14 dígitos" inputmode="numeric"
                   pattern="[0-9]{14}" maxlength="14" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="Tu contraseña" required>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit">Iniciar sesión</button>

        </form>

        <div class="enlace">
            <p>¿No tienes una cuenta?</p>
            <a href="{{ url_for('registro') }}">Crear cuenta</a>
            <br><br>
            <a href="{{ url_for('inicio') }}">Volver al inicio</a>
        </div>

    </div>

</body>
</html>
