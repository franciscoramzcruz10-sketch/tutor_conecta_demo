<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tutor Conecta</title>
    <style>
        :root {
            --azul: #1d4ed8;
            --azul-oscuro: #1e3a8a;
            --azul-claro: #e0efff;
            --rojo: #dc2626;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--azul-claro);
            color: var(--azul-oscuro);
            text-align: center;
        }

        header {
            background: var(--azul);
            color: white;
            padding: 25px;
            border-bottom: 5px solid var(--rojo);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 5px 0 0;
        }

        main {
            margin: 60px auto;
            padding: 30px;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #1d4ed826;
        }

        h2 {
            color: var(--azul);
        }

        h2::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            margin: 8px auto 0;
            background: var(--rojo);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid var(--azul);
        }

        button {
            width: 100%;
            padding: 13px 25px;
            margin-top: 25px;
            background: var(--azul);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: var(--azul-oscuro);
        }

        .error {
            background: #fee2e2;
            color: var(--rojo);
            border: 1px solid var(--rojo);
            padding: 10px;
            border-radius: 6px;
            margin: 15px 0 0;
            text-align: center;
        }

        .enlace {
            margin-top: 25px;
        }

        .enlace a {
            color: var(--azul);
        }
    </style>
</head>

<body>

    <header>
        <h1>Tutor Conecta</h1>
        <p>Conectando familias</p>
    </header>

    <main>

        <h2>Crear cuenta</h2>

        <form action="{{ url_for('registro') }}" method="post">

            <label for="numero_control">Número de control</label>
            <input type="text" id="numero_control" name="numero_control"
                   placeholder="14 dígitos" inputmode="numeric"
                   pattern="[0-9]{14}" maxlength="14" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="Crea una contraseña"
                   minlength="8" required>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit">Registrarse</button>

        </form>

        <div class="enlace">
            <p>¿Ya tienes una cuenta?</p>
            <a href="{{ url_for('inicio_sesion') }}">Iniciar sesión</a>
            <br><br>
            <a href="{{ url_for('inicio') }}">Volver al inicio</a>
        </div>

    </main>

</body>
</html>
